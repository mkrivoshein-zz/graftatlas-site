<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" font-family="Avenir, 'Avenir Next', 'Nunito Sans', Helvetica, Arial, sans-serif">
<rect width="1200" height="1200" fill="#1c3553"/>
<text x="60" y="96" fill="#ffffff" font-size="43" font-weight="700">Recuperación de un trasplante capilar, día a día</text>
<text x="60" y="142" fill="#a8bdd6" font-size="21">Un paciente, unos 5.000 injertos, FUE. Días contados desde el día de la operación.</text>
<line x1="150" y1="298" x2="150" y2="638" stroke="#3c5c82" stroke-width="3"/><line x1="150" y1="774" x2="150" y2="1046" stroke="#3c5c82" stroke-width="3"/>
<text x="150" y="236" fill="#9dbbe0" font-size="16" font-weight="700" letter-spacing="2.5">EL PRIMER MES</text><circle cx="150" cy="298" r="10" fill="#ffffff"/><text x="200" y="307" fill="#ffffff" font-size="27" font-weight="700">Día 0</text><text x="400" y="307" fill="#a8bdd6" font-size="21">Operación. Una sesión, unos 5.000 injertos.</text><circle cx="150" cy="366" r="8" fill="#9dbbe0"/><text x="200" y="375" fill="#ffffff" font-size="27" font-weight="700">Día 2</text><text x="400" y="375" fill="#a8bdd6" font-size="21">Cara hinchada. El peor día de ver.</text><circle cx="150" cy="434" r="8" fill="#9dbbe0"/><text x="200" y="443" fill="#ffffff" font-size="27" font-weight="700">Día 5</text><text x="400" y="443" fill="#a8bdd6" font-size="21">De vuelta a la oficina, con gorra.</text><circle cx="150" cy="502" r="8" fill="#9dbbe0"/><text x="200" y="511" fill="#ffffff" font-size="27" font-weight="700">Día 13</text><text x="400" y="511" fill="#a8bdd6" font-size="21">Se fueron las últimas costras al lavar.</text><circle cx="150" cy="570" r="8" fill="#9dbbe0"/><text x="200" y="579" fill="#ffffff" font-size="27" font-weight="700">Día 24</text><text x="400" y="579" fill="#a8bdd6" font-size="21">El pelo trasplantado empieza a caerse. Todavía no crece nada nuevo.</text><circle cx="150" cy="638" r="8" fill="#9dbbe0"/><text x="200" y="647" fill="#ffffff" font-size="27" font-weight="700">Día 28</text><text x="400" y="647" fill="#a8bdd6" font-size="17">La zona receptora vuelve a estar despejada. El rojo se fue, la piel sigue rosada.</text><text x="150" y="712" fill="#9dbbe0" font-size="16" font-weight="700" letter-spacing="2.5">MESES 2 A 5</text><circle cx="150" cy="774" r="8" fill="#9dbbe0"/><text x="200" y="783" fill="#ffffff" font-size="27" font-weight="700">Día 48</text><text x="400" y="783" fill="#a8bdd6" font-size="21">Primeros pelos nuevos. Crecen muy despacio.</text><circle cx="150" cy="842" r="8" fill="#9dbbe0"/><text x="200" y="840" fill="#ffffff" font-size="27" font-weight="700">Día 86</text><text x="200" y="866" fill="#9dbbe0" font-size="17">2,8 meses</text><text x="400" y="851" fill="#a8bdd6" font-size="21">El crecimiento se acelera de golpe.</text><circle cx="150" cy="910" r="8" fill="#9dbbe0"/><text x="200" y="908" fill="#ffffff" font-size="27" font-weight="700">Día 110</text><text x="200" y="934" fill="#9dbbe0" font-size="17">3,6 meses</text><text x="400" y="919" fill="#a8bdd6" font-size="21">Cerca de 1 cm. Se ve bien.</text><circle cx="150" cy="978" r="8" fill="#9dbbe0"/><text x="200" y="976" fill="#ffffff" font-size="27" font-weight="700">Día 124</text><text x="200" y="1002" fill="#9dbbe0" font-size="17">4,1 meses</text><text x="400" y="987" fill="#a8bdd6" font-size="21">El peinado volvió por completo.</text><circle cx="150" cy="1046" r="8" fill="#9dbbe0"/><text x="200" y="1044" fill="#ffffff" font-size="27" font-weight="700">Día 150</text><text x="200" y="1070" fill="#9dbbe0" font-size="17">4,9 meses</text><text x="400" y="1055" fill="#a8bdd6" font-size="21">Ya largo para empezar a rizarse.</text>
<g transform="translate(60 1112)" fill="none" stroke="#ffffff"><circle cx="12" cy="12" r="11" stroke-width="2.8"/><path d="M12 -1v26M-1 12h26" stroke-width="1.7"/></g>
<text x="104" y="1133" fill="#ffffff" font-size="29" font-weight="700">graftatlas.com</text>
<text x="1140" y="1133" text-anchor="end" fill="#a8bdd6" font-size="17">El diario de un paciente, no un calendario. No es consejo médico.</text>
</svg>
