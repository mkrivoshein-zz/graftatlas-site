<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" font-family="Avenir, 'Avenir Next', 'Nunito Sans', Helvetica, Arial, sans-serif">
<rect width="1200" height="1200" fill="#1c3553"/>
<text x="60" y="96" fill="#ffffff" font-size="43" font-weight="700">Hair transplant recovery, day by day</text>
<text x="60" y="142" fill="#a8bdd6" font-size="21">One patient, about 5,000 grafts, FUE. Days counted from the day of surgery.</text>
<line x1="150" y1="298" x2="150" y2="638" stroke="#3c5c82" stroke-width="3"/><line x1="150" y1="774" x2="150" y2="1046" stroke="#3c5c82" stroke-width="3"/>
<text x="150" y="236" fill="#9dbbe0" font-size="16" font-weight="700" letter-spacing="2.5">THE FIRST MONTH</text><circle cx="150" cy="298" r="10" fill="#ffffff"/><text x="200" y="307" fill="#ffffff" font-size="27" font-weight="700">Day 0</text><text x="400" y="307" fill="#a8bdd6" font-size="21">Surgery. One session, about 5,000 grafts.</text><circle cx="150" cy="366" r="8" fill="#9dbbe0"/><text x="200" y="375" fill="#ffffff" font-size="27" font-weight="700">Day 2</text><text x="400" y="375" fill="#a8bdd6" font-size="21">Face swollen. The worst day to look at.</text><circle cx="150" cy="434" r="8" fill="#9dbbe0"/><text x="200" y="443" fill="#ffffff" font-size="27" font-weight="700">Day 5</text><text x="400" y="443" fill="#a8bdd6" font-size="21">Back at the office, wearing a cap.</text><circle cx="150" cy="502" r="8" fill="#9dbbe0"/><text x="200" y="511" fill="#ffffff" font-size="27" font-weight="700">Day 13</text><text x="400" y="511" fill="#a8bdd6" font-size="21">The last crusts washed off.</text><circle cx="150" cy="570" r="8" fill="#9dbbe0"/><text x="200" y="579" fill="#ffffff" font-size="27" font-weight="700">Day 24</text><text x="400" y="579" fill="#a8bdd6" font-size="21">Transplanted hairs start falling out.</text><circle cx="150" cy="638" r="8" fill="#9dbbe0"/><text x="200" y="647" fill="#ffffff" font-size="27" font-weight="700">Day 28</text><text x="400" y="647" fill="#a8bdd6" font-size="21">Bald again. Redness gone, skin still pink.</text><text x="150" y="712" fill="#9dbbe0" font-size="16" font-weight="700" letter-spacing="2.5">MONTHS 2 TO 5</text><circle cx="150" cy="774" r="8" fill="#9dbbe0"/><text x="200" y="783" fill="#ffffff" font-size="27" font-weight="700">Day 48</text><text x="400" y="783" fill="#a8bdd6" font-size="21">First new hairs. Growing very slowly.</text><circle cx="150" cy="842" r="8" fill="#9dbbe0"/><text x="200" y="840" fill="#ffffff" font-size="27" font-weight="700">Day 86</text><text x="200" y="866" fill="#9dbbe0" font-size="17">2.8 months</text><text x="400" y="851" fill="#a8bdd6" font-size="21">Growth suddenly speeds up.</text><circle cx="150" cy="910" r="8" fill="#9dbbe0"/><text x="200" y="908" fill="#ffffff" font-size="27" font-weight="700">Day 110</text><text x="200" y="934" fill="#9dbbe0" font-size="17">3.6 months</text><text x="400" y="919" fill="#a8bdd6" font-size="21">About 1 cm long. Looks good.</text><circle cx="150" cy="978" r="8" fill="#9dbbe0"/><text x="200" y="976" fill="#ffffff" font-size="27" font-weight="700">Day 124</text><text x="200" y="1002" fill="#9dbbe0" font-size="17">4.1 months</text><text x="400" y="987" fill="#a8bdd6" font-size="21">The full hairstyle is back.</text><circle cx="150" cy="1046" r="8" fill="#9dbbe0"/><text x="200" y="1044" fill="#ffffff" font-size="27" font-weight="700">Day 150</text><text x="200" y="1070" fill="#9dbbe0" font-size="17">4.9 months</text><text x="400" y="1055" fill="#a8bdd6" font-size="21">Long enough to start curling.</text>
<g transform="translate(60 1112)" fill="none" stroke="#ffffff"><circle cx="12" cy="12" r="11" stroke-width="2.8"/><path d="M12 -1v26M-1 12h26" stroke-width="1.7"/></g>
<text x="104" y="1133" fill="#ffffff" font-size="29" font-weight="700">graftatlas.com</text>
<text x="1140" y="1133" text-anchor="end" fill="#a8bdd6" font-size="17">One patient's diary, not a schedule. Not medical advice.</text>
</svg>
