<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" font-family="Avenir, 'Avenir Next', 'Nunito Sans', Helvetica, Arial, sans-serif">
<rect width="1200" height="1200" fill="#1c3553"/>
<text x="60" y="96" fill="#ffffff" font-size="43" font-weight="700">Recupero dopo un trapianto, giorno per giorno</text>
<text x="60" y="142" fill="#a8bdd6" font-size="21">Un paziente, circa 5.000 unità, FUE. Giorni contati dal giorno dell&#x27;intervento.</text>
<line x1="150" y1="298" x2="150" y2="638" stroke="#3c5c82" stroke-width="3"/><line x1="150" y1="774" x2="150" y2="1046" stroke="#3c5c82" stroke-width="3"/>
<text x="150" y="236" fill="#9dbbe0" font-size="16" font-weight="700" letter-spacing="2.5">IL PRIMO MESE</text><circle cx="150" cy="298" r="10" fill="#ffffff"/><text x="200" y="307" fill="#ffffff" font-size="27" font-weight="700">Giorno 0</text><text x="400" y="307" fill="#a8bdd6" font-size="21">Intervento. Una sessione, circa 5.000 unità.</text><circle cx="150" cy="366" r="8" fill="#9dbbe0"/><text x="200" y="375" fill="#ffffff" font-size="27" font-weight="700">Giorno 2</text><text x="400" y="375" fill="#a8bdd6" font-size="21">Viso gonfio. Il giorno peggiore da vedere.</text><circle cx="150" cy="434" r="8" fill="#9dbbe0"/><text x="200" y="443" fill="#ffffff" font-size="27" font-weight="700">Giorno 5</text><text x="400" y="443" fill="#a8bdd6" font-size="21">Di nuovo in ufficio, con un cappellino.</text><circle cx="150" cy="502" r="8" fill="#9dbbe0"/><text x="200" y="511" fill="#ffffff" font-size="27" font-weight="700">Giorno 13</text><text x="400" y="511" fill="#a8bdd6" font-size="21">Via le ultime croste con il lavaggio.</text><circle cx="150" cy="570" r="8" fill="#9dbbe0"/><text x="200" y="579" fill="#ffffff" font-size="27" font-weight="700">Giorno 24</text><text x="400" y="579" fill="#a8bdd6" font-size="19">I capelli trapiantati iniziano a cadere. Di nuovo non cresce ancora nulla.</text><circle cx="150" cy="638" r="8" fill="#9dbbe0"/><text x="200" y="647" fill="#ffffff" font-size="27" font-weight="700">Giorno 28</text><text x="400" y="647" fill="#a8bdd6" font-size="20">Zona trapiantata di nuovo scoperta. Rossore sparito, pelle ancora rosa.</text><text x="150" y="712" fill="#9dbbe0" font-size="16" font-weight="700" letter-spacing="2.5">DAL 2o AL 5o MESE</text><circle cx="150" cy="774" r="8" fill="#9dbbe0"/><text x="200" y="783" fill="#ffffff" font-size="27" font-weight="700">Giorno 48</text><text x="400" y="783" fill="#a8bdd6" font-size="21">Primi capelli nuovi. Crescono lentissimi.</text><circle cx="150" cy="842" r="8" fill="#9dbbe0"/><text x="200" y="840" fill="#ffffff" font-size="27" font-weight="700">Giorno 86</text><text x="200" y="866" fill="#9dbbe0" font-size="17">2,8 mesi</text><text x="400" y="851" fill="#a8bdd6" font-size="21">La crescita accelera all&#x27;improvviso.</text><circle cx="150" cy="910" r="8" fill="#9dbbe0"/><text x="200" y="908" fill="#ffffff" font-size="27" font-weight="700">Giorno 110</text><text x="200" y="934" fill="#9dbbe0" font-size="17">3,6 mesi</text><text x="400" y="919" fill="#a8bdd6" font-size="21">Circa 1 cm. Sta bene.</text><circle cx="150" cy="978" r="8" fill="#9dbbe0"/><text x="200" y="976" fill="#ffffff" font-size="27" font-weight="700">Giorno 124</text><text x="200" y="1002" fill="#9dbbe0" font-size="17">4,1 mesi</text><text x="400" y="987" fill="#a8bdd6" font-size="21">La pettinatura è tornata del tutto.</text><circle cx="150" cy="1046" r="8" fill="#9dbbe0"/><text x="200" y="1044" fill="#ffffff" font-size="27" font-weight="700">Giorno 150</text><text x="200" y="1070" fill="#9dbbe0" font-size="17">4,9 mesi</text><text x="400" y="1055" fill="#a8bdd6" font-size="21">Abbastanza lunghi da iniziare a arricciarsi.</text>
<g transform="translate(60 1112)" fill="none" stroke="#ffffff"><circle cx="12" cy="12" r="11" stroke-width="2.8"/><path d="M12 -1v26M-1 12h26" stroke-width="1.7"/></g>
<text x="104" y="1133" fill="#ffffff" font-size="29" font-weight="700">graftatlas.com</text>
<text x="1140" y="1133" text-anchor="end" fill="#a8bdd6" font-size="17">Il diario di un paziente, non un calendario. Non è un consiglio medico.</text>
</svg>
