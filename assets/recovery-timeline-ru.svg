<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" font-family="Avenir, 'Avenir Next', 'Nunito Sans', Helvetica, Arial, sans-serif">
<rect width="1200" height="1200" fill="#1c3553"/>
<text x="60" y="96" fill="#ffffff" font-size="43" font-weight="700">Восстановление после пересадки волос по дням</text>
<text x="60" y="142" fill="#a8bdd6" font-size="21">Один пациент, около 5 000 графтов, FUE. Дни считаются от дня операции.</text>
<line x1="150" y1="298" x2="150" y2="638" stroke="#3c5c82" stroke-width="3"/><line x1="150" y1="774" x2="150" y2="1046" stroke="#3c5c82" stroke-width="3"/>
<text x="150" y="236" fill="#9dbbe0" font-size="16" font-weight="700" letter-spacing="2.5">ПЕРВЫЙ МЕСЯЦ</text><circle cx="150" cy="298" r="10" fill="#ffffff"/><text x="200" y="307" fill="#ffffff" font-size="27" font-weight="700">День 0</text><text x="400" y="307" fill="#a8bdd6" font-size="21">Операция. Один сеанс, около 5 000 графтов.</text><circle cx="150" cy="366" r="8" fill="#9dbbe0"/><text x="200" y="375" fill="#ffffff" font-size="27" font-weight="700">День 2</text><text x="400" y="375" fill="#a8bdd6" font-size="21">Лицо опухло. Самый неприятный день на вид.</text><circle cx="150" cy="434" r="8" fill="#9dbbe0"/><text x="200" y="443" fill="#ffffff" font-size="27" font-weight="700">День 5</text><text x="400" y="443" fill="#a8bdd6" font-size="21">Вышел в офис, в кепке.</text><circle cx="150" cy="502" r="8" fill="#9dbbe0"/><text x="200" y="511" fill="#ffffff" font-size="27" font-weight="700">День 13</text><text x="400" y="511" fill="#a8bdd6" font-size="21">Последние корки отмылись.</text><circle cx="150" cy="570" r="8" fill="#9dbbe0"/><text x="200" y="579" fill="#ffffff" font-size="27" font-weight="700">День 24</text><text x="400" y="579" fill="#a8bdd6" font-size="21">Пересаженные волосы начали выпадать. Новые пока не растут.</text><circle cx="150" cy="638" r="8" fill="#9dbbe0"/><text x="200" y="647" fill="#ffffff" font-size="27" font-weight="700">День 28</text><text x="400" y="647" fill="#a8bdd6" font-size="21">В зоне пересадки снова лысо. Краснота прошла, кожа ещё розовая.</text><text x="150" y="712" fill="#9dbbe0" font-size="16" font-weight="700" letter-spacing="2.5">МЕСЯЦЫ С 2 ПО 5</text><circle cx="150" cy="774" r="8" fill="#9dbbe0"/><text x="200" y="783" fill="#ffffff" font-size="27" font-weight="700">День 48</text><text x="400" y="783" fill="#a8bdd6" font-size="21">Первые новые волосы. Растут очень медленно.</text><circle cx="150" cy="842" r="8" fill="#9dbbe0"/><text x="200" y="840" fill="#ffffff" font-size="27" font-weight="700">День 86</text><text x="200" y="866" fill="#9dbbe0" font-size="17">2,8 мес.</text><text x="400" y="851" fill="#a8bdd6" font-size="21">Рост резко ускорился.</text><circle cx="150" cy="910" r="8" fill="#9dbbe0"/><text x="200" y="908" fill="#ffffff" font-size="27" font-weight="700">День 110</text><text x="200" y="934" fill="#9dbbe0" font-size="17">3,6 мес.</text><text x="400" y="919" fill="#a8bdd6" font-size="21">Около 1 см. Выглядит хорошо.</text><circle cx="150" cy="978" r="8" fill="#9dbbe0"/><text x="200" y="976" fill="#ffffff" font-size="27" font-weight="700">День 124</text><text x="200" y="1002" fill="#9dbbe0" font-size="17">4,1 мес.</text><text x="400" y="987" fill="#a8bdd6" font-size="21">Причёска вернулась полностью.</text><circle cx="150" cy="1046" r="8" fill="#9dbbe0"/><text x="200" y="1044" fill="#ffffff" font-size="27" font-weight="700">День 150</text><text x="200" y="1070" fill="#9dbbe0" font-size="17">4,9 мес.</text><text x="400" y="1055" fill="#a8bdd6" font-size="21">Волосы отросли и начали закручиваться.</text>
<g transform="translate(60 1112)" fill="none" stroke="#ffffff"><circle cx="12" cy="12" r="11" stroke-width="2.8"/><path d="M12 -1v26M-1 12h26" stroke-width="1.7"/></g>
<text x="104" y="1133" fill="#ffffff" font-size="29" font-weight="700">graftatlas.com</text>
<text x="1140" y="1133" text-anchor="end" fill="#a8bdd6" font-size="17">Дневник одного пациента, не расписание. Не медицинская рекомендация.</text>
</svg>
