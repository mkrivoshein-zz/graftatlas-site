<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" font-family="Avenir, 'Avenir Next', 'Nunito Sans', Helvetica, Arial, sans-serif">
<rect width="1200" height="1200" fill="#1c3553"/>
<text x="60" y="96" fill="#ffffff" font-size="43" font-weight="700">Récupération après une greffe, jour par jour</text>
<text x="60" y="142" fill="#a8bdd6" font-size="21">Un patient, environ 5 000 greffons, FUE. Jours comptés depuis l&#x27;opération.</text>
<line x1="150" y1="298" x2="150" y2="638" stroke="#3c5c82" stroke-width="3"/><line x1="150" y1="774" x2="150" y2="1046" stroke="#3c5c82" stroke-width="3"/>
<text x="150" y="236" fill="#9dbbe0" font-size="16" font-weight="700" letter-spacing="2.5">LE PREMIER MOIS</text><circle cx="150" cy="298" r="10" fill="#ffffff"/><text x="200" y="307" fill="#ffffff" font-size="27" font-weight="700">Jour 0</text><text x="400" y="307" fill="#a8bdd6" font-size="21">Opération. Une séance, environ 5 000 greffons.</text><circle cx="150" cy="366" r="8" fill="#9dbbe0"/><text x="200" y="375" fill="#ffffff" font-size="27" font-weight="700">Jour 2</text><text x="400" y="375" fill="#a8bdd6" font-size="21">Visage gonflé. Le pire jour à voir.</text><circle cx="150" cy="434" r="8" fill="#9dbbe0"/><text x="200" y="443" fill="#ffffff" font-size="27" font-weight="700">Jour 5</text><text x="400" y="443" fill="#a8bdd6" font-size="21">Retour au bureau, avec une casquette.</text><circle cx="150" cy="502" r="8" fill="#9dbbe0"/><text x="200" y="511" fill="#ffffff" font-size="27" font-weight="700">Jour 13</text><text x="400" y="511" fill="#a8bdd6" font-size="21">Les dernières croûtes sont parties au lavage.</text><circle cx="150" cy="570" r="8" fill="#9dbbe0"/><text x="200" y="579" fill="#ffffff" font-size="27" font-weight="700">Jour 24</text><text x="400" y="579" fill="#a8bdd6" font-size="20">Les cheveux greffés commencent à tomber. Rien de neuf ne pousse encore.</text><circle cx="150" cy="638" r="8" fill="#9dbbe0"/><text x="200" y="647" fill="#ffffff" font-size="27" font-weight="700">Jour 28</text><text x="400" y="647" fill="#a8bdd6" font-size="19">De nouveau dégarni sur la zone greffée. Rougeur partie, peau encore rose.</text><text x="150" y="712" fill="#9dbbe0" font-size="16" font-weight="700" letter-spacing="2.5">DU 2e AU 5e MOIS</text><circle cx="150" cy="774" r="8" fill="#9dbbe0"/><text x="200" y="783" fill="#ffffff" font-size="27" font-weight="700">Jour 48</text><text x="400" y="783" fill="#a8bdd6" font-size="21">Premiers cheveux neufs. Très lents.</text><circle cx="150" cy="842" r="8" fill="#9dbbe0"/><text x="200" y="840" fill="#ffffff" font-size="27" font-weight="700">Jour 86</text><text x="200" y="866" fill="#9dbbe0" font-size="17">2,8 mois</text><text x="400" y="851" fill="#a8bdd6" font-size="21">La pousse s&#x27;accélère d&#x27;un coup.</text><circle cx="150" cy="910" r="8" fill="#9dbbe0"/><text x="200" y="908" fill="#ffffff" font-size="27" font-weight="700">Jour 110</text><text x="200" y="934" fill="#9dbbe0" font-size="17">3,6 mois</text><text x="400" y="919" fill="#a8bdd6" font-size="21">Environ 1 cm. Ça rend bien.</text><circle cx="150" cy="978" r="8" fill="#9dbbe0"/><text x="200" y="976" fill="#ffffff" font-size="27" font-weight="700">Jour 124</text><text x="200" y="1002" fill="#9dbbe0" font-size="17">4,1 mois</text><text x="400" y="987" fill="#a8bdd6" font-size="21">La coiffure est entièrement revenue.</text><circle cx="150" cy="1046" r="8" fill="#9dbbe0"/><text x="200" y="1044" fill="#ffffff" font-size="27" font-weight="700">Jour 150</text><text x="200" y="1070" fill="#9dbbe0" font-size="17">4,9 mois</text><text x="400" y="1055" fill="#a8bdd6" font-size="21">Assez longs pour commencer à boucler.</text>
<g transform="translate(60 1112)" fill="none" stroke="#ffffff"><circle cx="12" cy="12" r="11" stroke-width="2.8"/><path d="M12 -1v26M-1 12h26" stroke-width="1.7"/></g>
<text x="104" y="1133" fill="#ffffff" font-size="29" font-weight="700">graftatlas.com</text>
<text x="1140" y="1133" text-anchor="end" fill="#a8bdd6" font-size="17">Journal d&#x27;un patient, pas un calendrier. Pas un avis médical.</text>
</svg>
